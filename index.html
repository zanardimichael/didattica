<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le mie dispense</title>
  <meta name="description" content="Raccolta di dispense e siti didattici per studenti delle superiori.">
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <header class="hero text-center text-white position-relative">
    <button id="tema-toggle" type="button" class="btn btn-light rounded-circle" aria-label="Cambia tema chiaro/scuro" title="Cambia tema"></button>
    <div class="container py-5">
      <h1 class="display-4 fw-bold">Dispense "Villa Greppi"</h1>
      <p class="lead mb-0">Tutte le dispense Online del corso di Informatica dell'IISS "A. Greppi"</p>
    </div>
  </header>

  <main class="container my-5">
    <nav id="nav-categorie" class="d-flex flex-wrap justify-content-center gap-2 mb-5" aria-label="Categorie"></nav>
    <div id="cards"></div>
  </main>

  <footer class="text-center text-muted py-4">
    <small>Prof. Michael Zanardi · Anno scolastico 2026/27</small>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/siti.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
